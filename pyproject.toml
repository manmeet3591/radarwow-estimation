[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarwow-estimation"
version = "0.1.0"
description = "radar-wow stage 6: Rain-rate estimators, VPR, blockage, hybrid scan"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["radarwow-core @ git+https://github.com/manmeet3591/radarwow-core", "radarwow-kdp @ git+https://github.com/manmeet3591/radarwow-kdp", "radarwow-attenuation @ git+https://github.com/manmeet3591/radarwow-attenuation", "numpy", "scipy", "xarray"]

[project.optional-dependencies]
advection = ["pysteps", "opencv-python-headless"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
